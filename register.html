<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register · Application Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
<div class="auth-wrap">
  <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Application Dashboard</a>
  <div class="card auth-card">
    <h1>Create your account</h1>
    <p class="sub">Use a password of at least 12 characters.</p>
    <div id="form-alert" class="alert" role="alert" hidden></div>
    <form id="register-form" novalidate>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required><div class="field-error" id="email-error"></div></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint"><div class="hint" id="password-hint">At least 12 characters.</div><div class="field-error" id="password-error"></div></div>
      <div class="field"><label for="confirm">Confirm password</label><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="field-error" id="confirm-error"></div></div>
      <button class="btn btn-primary btn-block" type="submit" id="register-submit">Register</button>
    </form>
    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
