<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected Forms · Application Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-protected data-page="forms">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <div class="page-head"><div><h1>Connected Forms</h1><p>Google Forms that feed applications into this dashboard.</p></div></div>
    <div class="stack">
      <section class="card card-pad" aria-labelledby="connect-h">
        <h2 id="connect-h">Connect a form</h2>
        <div id="form-alert" class="alert" role="alert" hidden></div>
        <form id="connect-form" class="inline-form" novalidate>
          <div class="field"><label class="sr-only" for="form-input">Google Form URL or Form ID</label><input class="input" id="form-input" type="text" autocomplete="off" placeholder="Google Form URL or Form ID"><div class="field-error" id="form-input-error"></div></div>
          <button class="btn btn-primary" type="submit" id="connect-submit">Connect Google Form</button>
        </form>
      </section>
      <section class="card" aria-label="Connected forms">
        <div class="table-wrap"><table>
          <thead><tr><th scope="col">Form name</th><th scope="col">Google Form ID</th><th scope="col">Status</th><th scope="col">Connected date</th><th scope="col">Actions</th></tr></thead>
          <tbody id="forms-body"></tbody>
        </table></div>
      </section>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/forms.js"></script>
</body>
</html>
