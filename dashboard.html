<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Application Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-protected data-page="dashboard">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <div class="page-head"><div><h1>Dashboard</h1><p>A snapshot of everything submitted so far.</p></div><a class="btn btn-primary" href="applications.html">View all applications</a></div>
    <section class="stats" aria-label="Application totals">
      <div class="card stat" style="--c:var(--accent)"><div class="stat-label">Total Applications</div><div class="stat-value" id="stat-total"><span class="skeleton lg"></span></div></div>
      <div class="card stat" style="--c:var(--pending)"><div class="stat-label">Pending</div><div class="stat-value" id="stat-pending"><span class="skeleton lg"></span></div></div>
      <div class="card stat" style="--c:var(--interview)"><div class="stat-label">Interview</div><div class="stat-value" id="stat-interview"><span class="skeleton lg"></span></div></div>
      <div class="card stat" style="--c:var(--accepted)"><div class="stat-label">Accepted</div><div class="stat-value" id="stat-accepted"><span class="skeleton lg"></span></div></div>
      <div class="card stat" style="--c:var(--denied)"><div class="stat-label">Denied</div><div class="stat-value" id="stat-denied"><span class="skeleton lg"></span></div></div>
    </section>
    <section class="card" aria-labelledby="recent-h">
      <div class="card-head"><h2 id="recent-h">Recent applications</h2><a href="applications.html">See all</a></div>
      <div class="table-wrap"><table>
        <thead><tr><th scope="col">Discord username</th><th scope="col">Faction</th><th scope="col">Status</th><th scope="col">Submitted</th><th scope="col"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody id="recent-body"></tbody>
      </table></div>
    </section>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
