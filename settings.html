<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Application Dashboard</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-protected data-page="settings">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <main class="main" id="main">
    <div class="page-head"><div><h1>Settings</h1><p>Manage your account and sign-in options.</p></div></div>
    <div class="stack" style="max-width:720px">
      <section class="card card-pad" aria-labelledby="acct-h">
        <h2 id="acct-h">Account</h2>
        <div class="row"><div><div class="muted">Email</div><strong id="acct-email"><span class="skeleton" style="width:160px"></span></strong></div></div>
        <div class="row"><div><div class="muted">Discord</div><strong id="acct-discord"><span class="skeleton" style="width:120px"></span></strong></div><button type="button" class="btn btn-discord" id="link-discord">Link Discord</button></div>
      </section>
      <section class="card card-pad" aria-labelledby="pw-h">
        <h2 id="pw-h">Change password</h2>
        <div id="form-alert" class="alert" role="alert" hidden></div>
        <form id="password-form" novalidate>
          <div class="field"><label for="current-password">Current password</label><input class="input" id="current-password" type="password" autocomplete="current-password"><div class="field-error" id="current-password-error"></div></div>
          <div class="field"><label for="new-password">New password</label><input class="input" id="new-password" type="password" autocomplete="new-password"><div class="hint">At least 12 characters.</div><div class="field-error" id="new-password-error"></div></div>
          <div class="field"><label for="confirm-password">Confirm new password</label><input class="input" id="confirm-password" type="password" autocomplete="new-password"><div class="field-error" id="confirm-password-error"></div></div>
          <button class="btn btn-primary" type="submit" id="password-submit">Change Password</button>
        </form>
      </section>
      <section class="card card-pad" aria-labelledby="sess-h">
        <h2 id="sess-h">Sessions</h2>
        <div class="row"><p class="muted">Sign out of every device where you are logged in.</p><button type="button" class="btn btn-danger" id="logout-all">Logout everywhere</button></div>
      </section>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
